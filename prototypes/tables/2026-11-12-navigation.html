<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORECA Tables — synthetic demo</title>
<style>body{font:16px system-ui;margin:0;background:#f6f7fa;color:#182334}header{background:#172b45;color:white;padding:1rem}nav,main{padding:1rem}button,input{font:inherit;padding:.4rem}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1671c5}#floor{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.table{background:white;border:2px solid #287449;border-radius:1rem;padding:1rem}.occupied{border-color:#a35b19;background:#fff4e8}</style><link rel="stylesheet" href="horeca-ui.css"></head>
<body class="horeca-legacy horeca-navigation"><header class="site-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l2-6h14l2 6v2a3 3 0 0 1-5 2 3 3 0 0 1-5 0 3 3 0 0 1-5 0 3 3 0 0 1-3-2v-2Zm2 5v6h14v-6M9 21v-6h6v6"/></svg></span><strong>HORECA</strong></div><div class="page-heading"><h1>Tables</h1><p>Physical inventory · Venue operations</p></div><span class="header-context">Offline prototype</span></header><nav aria-label="Primary"><button id="overview-tab" aria-current="page">Overview</button> <button id="tables-tab">Tables</button></nav><main><section id="overview"><h1>Overview</h1><p>No live venue data or backend connection.</p></section><section id="tables" hidden><h1>Tables</h1><p>Local synthetic demonstration; changes reset on reload.</p><p id="summary" aria-live="polite"></p><div id="floor" aria-label="Physical table inventory"></div><p id="message" role="status" aria-live="polite"></p></section></main>
<script>
'use strict';
const inventory=[{id:'T1',seats:2,guests:0},{id:'T2',seats:4,guests:0},{id:'T3',seats:6,guests:3},{id:'T4',seats:4,guests:0}];
function seat(id,count){const t=inventory.find(t=>t.id===id);if(!t||!Number.isInteger(count)||count<1)return 'Invalid seating request';if(t.guests>0)return 'Table already occupied';if(count>t.seats)return 'Guest count exceeds physical seats';t.guests=count;return null;}
function show(tab){for(const name of ['overview','tables']){document.getElementById(name).hidden=name!==tab;const b=document.getElementById(name+'-tab');if(name===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}if(tab==='tables')render();}
function render(){const floor=document.getElementById('floor');floor.replaceChildren();for(const t of inventory){const card=document.createElement('article');card.className='table '+(t.guests?'occupied':'available');const h=document.createElement('h2');h.textContent='Table '+t.id;const status=document.createElement('p');status.textContent=t.guests?'Occupied · '+t.guests+' guests':'Available';const cap=document.createElement('p');cap.textContent='Physical seats: '+t.seats;card.append(h,status,cap);if(!t.guests){const label=document.createElement('label');label.textContent='Guests ';const input=document.createElement('input');input.type='number';input.min='1';input.max=String(t.seats);input.step='1';input.value='1';input.setAttribute('aria-label','Guests for table '+t.id);label.append(input);const btn=document.createElement('button');btn.textContent='Seat';btn.setAttribute('aria-label','Seat guests at table '+t.id);btn.addEventListener('click',()=>{const count=input.value.trim()===''?NaN:Number(input.value);const error=seat(t.id,count);document.getElementById('message').textContent=error||('Seated '+count+' guests at '+t.id+' (demo only)');render();});card.append(label,btn);}floor.append(card);}document.getElementById('summary').textContent=inventory.filter(t=>t.guests).length+' occupied · '+inventory.filter(t=>!t.guests).length+' available';}
document.getElementById('overview-tab').addEventListener('click',()=>show('overview'));document.getElementById('tables-tab').addEventListener('click',()=>show('tables'));
</script></body></html>
